<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una invitación especial</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500&display=swap');

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
}

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    font-family: 'Montserrat', sans-serif;
    color: #f5f1e8;

    background:
        radial-gradient(
            circle at 50% 45%,
            #68775d 0%,
            #4b5943 42%,
            #303a2d 72%,
            #1d241b 100%
        );
    background-attachment: fixed;
    overflow-x: hidden;
}

/* =========================================
   LUZ AMBIENTAL
========================================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(218, 190, 113, 0.10),
            transparent 45%
        );

    pointer-events: none;
}

/* =========================================
   CONTENEDOR
========================================= */

.card {
    position: relative;
    z-index: 5;

    width: min(100%, 430px);
    margin: auto;
    padding: clamp(30px, 8vw, 60px) clamp(20px, 6vw, 45px);

    text-align: center;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.13),
            rgba(255,255,255,0.045)
        );

    border: 1px solid rgba(224, 195, 116, 0.45);
    border-radius: 4px;

    box-shadow:
        0 30px 80px rgba(0,0,0,0.55),
        inset 0 0 40px rgba(255,255,255,0.025);

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    opacity: 0;
    transform: translateY(25px) scale(0.97);

    animation: cardReveal 2s cubic-bezier(.22,.61,.36,1) forwards;
}

/* =========================================
   MARCO INTERIOR
========================================= */

.card::before {
    content: "";

    position: absolute;
    inset: 10px;

    border: 1px solid rgba(218,190,113,0.25);

    pointer-events: none;
}

/* =========================================
   ORNAMENTOS
========================================= */

.ornament {
    display: flex;
    justify-content: center;
    align-items: center;

    margin-bottom: 20px;

    color: #d8bd72;

    font-size: 18px;
    letter-spacing: 8px;
}

.ornament::before,
.ornament::after {
    content: "";

    flex: 1;
    max-width: 55px;
    height: 1px;

    background: linear-gradient(
        to right,
        transparent,
        #cdb36b
    );
}

.ornament::after {
    background: linear-gradient(
        to left,
        transparent,
        #cdb36b
    );
}

/* =========================================
   TEXTO PRINCIPAL
========================================= */

.card h1 {
    margin: 0;

    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(32px, 8vw, 52px);
    font-weight: 500;

    letter-spacing: 1px;

    color: #f7f2e7;

    text-shadow:
        0 2px 20px rgba(0,0,0,0.25);
}

/* =========================================
   SUBTÍTULO
========================================= */

.card p {
    margin: 14px 0 0;

    font-family: 'Montserrat', sans-serif;
    font-size: clamp(11px, 3vw, 14px);

    font-weight: 300;
    letter-spacing: 2px;
    line-height: 1.8;

    color: rgba(245,241,232,0.78);

    text-transform: uppercase;
}

/* =========================================
   PEQUEÑO DETALLE DORADO
========================================= */

.gold-dot {
    width: 5px;
    height: 5px;

    margin: 25px auto 0;

    border-radius: 50%;

    background: #d8bd72;

    box-shadow:
        0 0 12px rgba(216,189,114,0.8);
}

/* =========================================
   ANIMACIÓN TARJETA
========================================= */

@keyframes cardReveal {

    0% {
        opacity: 0;
        transform:
            translateY(25px)
            scale(0.97);
    }

    100% {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}

/* =========================================
   PARTÍCULAS DORADAS
========================================= */

.particle {
    position: absolute;

    width: var(--size);
    height: var(--size);

    top: 50%;
    left: 50%;

    border-radius: 50%;

    background: #d8bd72;

    box-shadow:
        0 0 8px rgba(216,189,114,0.9);

    opacity: 0;

    pointer-events: none;

    animation:
        particleExpand
        var(--duration)
        cubic-bezier(.22,.61,.36,1)
        forwards;
}

@keyframes particleExpand {

    0% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(0);
    }

    15% {
        opacity: 0.9;
    }

    70% {
        opacity: 0.5;
    }

    100% {
        opacity: 0;

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(1);
    }
}

/* =========================================
   DESTELLO FINAL
========================================= */

.flash {
    position: fixed;

    top: 50%;
    left: 50%;

    width: 0;
    height: 0;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,0.95) 0%,
            rgba(246,232,185,0.7) 12%,
            rgba(255,255,255,0.25) 35%,
            transparent 70%
        );

    transform: translate(-50%, -50%);

    z-index: 999;

    pointer-events: none;

    opacity: 0;
}

.flash.active {
    animation: luxuryFlash 2s cubic-bezier(.22,.61,.36,1) forwards;
}

@keyframes luxuryFlash {

    0% {
        width: 0;
        height: 0;
        opacity: 0;
    }

    15% {
        opacity: 0.85;
    }

    45% {
        opacity: 0.55;
    }

    100% {
        width: 350vmax;
        height: 350vmax;
        opacity: 1;
    }
}

/* =========================================
   VIÑETA
========================================= */

.vignette {
    position: fixed;
    inset: 0;

    z-index: 3;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,0.32) 100%
        );
}
</style>
</head>

<body>

<!-- Viñeta -->
<div class="vignette"></div>

<!-- Tarjeta -->
<div class="card">

    <div class="ornament">
        ✦
    </div>

    <h1>Estás invitado</h1>

    <p>
        Una celebración muy especial te espera
    </p>

    <div class="gold-dot"></div>

</div>

<!-- Destello -->
<div class="flash" id="flash"></div>

<script>

/* =========================================
   CONFIGURACIÓN
========================================= */

const particles = 65;

/* =========================================
   CREAR PARTÍCULas
========================================= */

for (let i = 0; i < particles; i++) {

    const particle = document.createElement("div");

    particle.classList.add("particle");

    const angle =
        Math.random() * Math.PI * 2;

    const distance =
        70 + Math.random() * 280;

    const x =
        Math.cos(angle) * distance;

    const y =
        Math.sin(angle) * distance;

    const size =
        2 + Math.random() * 3;

    const duration =
        3 + Math.random() * 2;

    particle.style.setProperty(
        "--x",
        `${x}px`
    );

    particle.style.setProperty(
        "--y",
        `${y}px`
    );

    particle.style.setProperty(
        "--size",
        `${size}px`
    );

    particle.style.setProperty(
        "--duration",
        `${duration}s`
    );

    document.body.appendChild(particle);
}

/* =========================================
   DESTELLO
========================================= */

setTimeout(() => {

    document
        .getElementById("flash")
        .classList.add("active");

}, 3800);

/* =========================================
   REDIRECCIÓN
========================================= */

setTimeout(() => {

    window.location.href = "index.html";

}, 5700);

</script>

</body>
</html>
